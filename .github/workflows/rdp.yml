name: Windows RDP

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  rdp:
    runs-on: windows-latest

    steps:
    - name: Install & Connect Tailscale
      shell: powershell
      run: |
        choco install tailscale -y
        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
        if (-not (Test-Path $tailscaleExe)) {
            $tailscaleExe = "C:\Program Files (x86)\Tailscale\tailscale.exe"
        }
        & $tailscaleExe up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --accept-routes

    - name: Enable Remote Desktop & Set Password
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: powershell
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

        $PasswordChars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*"
        $Password = -join ((1..16) | ForEach-Object { $PasswordChars[(Get-Random -Maximum $PasswordChars.Length)] })

        $Username = "runneradmin"
        $SecPassword = ConvertTo-SecureString $Password -AsPlainText -Force
        
        try {
            Set-LocalUser -Name $Username -Password $SecPassword
        } catch {
            net user $Username $Password /add
            net localgroup Administrators $Username /add
        }

        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
        if (-not (Test-Path $tailscaleExe)) {
            $tailscaleExe = "C:\Program Files (x86)\Tailscale\tailscale.exe"
        }
        $TsIp = (& $tailscaleExe ip -4).Trim()

        Write-Host "========================================"
        Write-Host "RDP_INFO_START"
        Write-Host "TAILSCALE_IP: $TsIp"
        Write-Host "USERNAME: $Username"
        Write-Host "PASSWORD: $Password"
        Write-Host "PORT: 3389"
        Write-Host "RDP_INFO_END"
        Write-Host "========================================"

        try {
            gh variable set RDP_IP --body "$TsIp" --repo ${{ github.repository }}
            gh variable set RDP_USER --body "$Username" --repo ${{ github.repository }}
            gh variable set RDP_PASSWORD --body "$Password" --repo ${{ github.repository }}
            gh variable set RDP_PORT --body "3389" --repo ${{ github.repository }}
        } catch {
            Write-Host "Variable update skipped."
        }

    - name: Keep Alive Loop
      shell: powershell
      run: |
        Write-Host "RDP session active. Keeping workflow alive for 6 hours..."
        for ($i=1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "RDP session active ($i / 360 minutes)..."
        }

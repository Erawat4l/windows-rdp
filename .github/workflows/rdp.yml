name: High-Speed Windows RDP & Terminal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rdp:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Enable High-Speed Remote Desktop & SSH Terminal
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: powershell
      run: |
        $ErrorActionPreference = "SilentlyContinue"

        Write-Host "⚙️ Enabling Remote Desktop..."
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

        $Password = "@EraRDP0811#"
        $Username = "Erawat"
        $SecPassword = ConvertTo-SecureString $Password -AsPlainText -Force
        
        try {
            Set-LocalUser -Name $Username -Password $SecPassword
        } catch {}

        net user $Username "$Password" /add
        net user $Username "$Password"
        net localgroup Administrators $Username /add

        try {
            Set-LocalUser -Name "Administrator" -Password $SecPassword
            Enable-LocalUser -Name "Administrator"
        } catch {}
        net user Administrator "$Password" /active:yes

        Write-Host "📦 Starting OpenSSH Server for rdpt Terminal Access..."
        try {
            Start-Service sshd
            Set-Service -Name sshd -StartupType "Automatic"
            Enable-NetFirewallRule -Name "OpenSSH-Server-In-TCP"
        } catch {}

        Write-Host "📦 Installing Cloudflare Tunnel..."
        curl.exe -sL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -o "C:\Windows\cloudflared.exe"

        $cfJob = Start-Job -ScriptBlock {
            $ErrorActionPreference = "SilentlyContinue"
            & "C:\Windows\cloudflared.exe" tunnel --url tcp://localhost:3389
        }

        $cfUrl = ""
        for ($i=1; $i -le 15; $i++) {
            Start-Sleep -Seconds 2
            $output = Receive-Job -Job $cfJob -ErrorAction SilentlyContinue | Out-String
            if ($output -match 'tcp://[a-zA-Z0-9\.-]+:([0-9]+)') {
                $cfUrl = $matches[0]
                break
            }
        }

        Write-Host "📦 Installing Tailscale..."
        try {
            choco install tailscale -y
            $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
            if (-not (Test-Path $tailscaleExe)) {
                $tailscaleExe = "C:\Program Files (x86)\Tailscale\tailscale.exe"
            }
            & $tailscaleExe up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --accept-routes --hostname="rdp-runner"
            Start-Sleep -Seconds 3
            $TsIp = (& $tailscaleExe ip -4).Trim()
        } catch {
            $TsIp = "Tailscale Offline"
        }

        # Create hidden background vbs keep-alive script
        $vbsPath = "$env:TEMP\keepalive.vbs"
        $vbsContent = "Set WshShell = CreateObject(`"WScript.Shell`")" + "`n" + "Do" + "`n" + "  WScript.Sleep 60000" + "`n" + "Loop"
        Set-Content -Path $vbsPath -Value $vbsContent
        Start-Process "wscript.exe" -ArgumentList "`"$vbsPath`""

        $InfoBlock = "RDP_INFO_START`nCF_TUNNEL: $cfUrl`nTAILSCALE_IP: $TsIp`nUSERNAME: $Username`nPASSWORD: $Password`nPORT: 3389`nRDP_INFO_END"

        Write-Host "========================================"
        Write-Host $InfoBlock
        Write-Host "========================================"

        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### High-Speed RDP Details`n- **Cloudflare Tunnel**: $cfUrl`n- **Tailscale IP**: $TsIp`n- **Username**: $Username`n- **Password**: $Password`n- **Port**: 3389"

        try {
            gh api "/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/comments" -f body="$InfoBlock"
        } catch {}

    - name: Hidden Keep Alive Loop
      shell: powershell
      run: |
        Write-Host "RDP session active in background. Keeping workflow alive for 6 hours..."
        while (Get-Process -Name "wscript" -ErrorAction SilentlyContinue) {
            Start-Sleep -Seconds 30
        }

    - name: Logout & Remove from Tailscale
      if: always()
      shell: powershell
      run: |
        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
        if (Test-Path $tailscaleExe) {
            & $tailscaleExe logout
        }

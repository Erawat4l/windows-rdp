name: High-Speed Windows RDP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rdp:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Enable RDP & Start High-Speed Tunnel
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: powershell
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

        $PasswordChars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*"
        $Password = -join ((1..16) | ForEach-Object { $PasswordChars[(Get-Random -Maximum $PasswordChars.Length)] })

        $Username = "runneradmin"
        $SecPassword = ConvertTo-SecureString $Password -AsPlainText -Force
        
        try {
            Set-LocalUser -Name $Username -Password $SecPassword
        } catch {
            net user $Username $Password /add
            net localgroup Administrators $Username /add
        }

        # Install cloudflared for global edge speed
        choco install cloudflared -y

        $cfJob = Start-Job -ScriptBlock {
            cloudflared tunnel --url tcp://localhost:3389
        }

        $cfUrl = ""
        for ($i=1; $i -le 25; $i++) {
            Start-Sleep -Seconds 2
            $output = Receive-Job -Job $cfJob -Keep | Out-String
            if ($output -match "tcp://[a-zA-Z0-9\.-]+:([0-9]+)") {
                $cfUrl = $matches[0]
                break
            }
        }

        # Backup: Install Tailscale
        try {
            choco install tailscale -y
            $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
            if (-not (Test-Path $tailscaleExe)) {
                $tailscaleExe = "C:\Program Files (x86)\Tailscale\tailscale.exe"
            }
            & $tailscaleExe up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --accept-routes
            $TsIp = (& $tailscaleExe ip -4).Trim()
        } catch {
            $TsIp = "Tailscale Offline"
        }

        $InfoBlock = "RDP_INFO_START`nCF_TUNNEL: $cfUrl`nTAILSCALE_IP: $TsIp`nUSERNAME: $Username`nPASSWORD: $Password`nPORT: 3389`nRDP_INFO_END"

        Write-Host "========================================"
        Write-Host $InfoBlock
        Write-Host "========================================"

        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### High-Speed RDP Details`n- **Cloudflare Tunnel**: $cfUrl`n- **Tailscale IP**: $TsIp`n- **Username**: $Username`n- **Password**: $Password`n- **Port**: 3389"

        try {
            gh api "/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/comments" -f body="$InfoBlock"
        } catch {
            Write-Host "Failed to post comment."
        }

    - name: Keep Alive Loop
      shell: powershell
      run: |
        Write-Host "RDP session active. Keeping workflow alive for 6 hours..."
        for ($i=1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "RDP session active ($i / 360 minutes)..."
        }

    - name: Logout & Remove from Tailscale
      if: always()
      shell: powershell
      run: |
        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
        if (Test-Path $tailscaleExe) {
            & $tailscaleExe logout
        }

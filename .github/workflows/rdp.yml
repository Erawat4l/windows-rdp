name: High-Speed Windows RDP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rdp:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Enable RDP & Set Fixed Password
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: powershell
      run: |
        $ErrorActionPreference = "SilentlyContinue"

        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

        $Password = "EraRdp2026WinPass"
        $Username = "runneradmin"
        $SecPassword = ConvertTo-SecureString $Password -AsPlainText -Force
        
        try {
            Set-LocalUser -Name $Username -Password $SecPassword
        } catch {}

        net user $Username "$Password" /add
        net user $Username "$Password"
        net localgroup Administrators $Username /add

        try {
            Set-LocalUser -Name "Administrator" -Password $SecPassword
            Enable-LocalUser -Name "Administrator"
        } catch {}
        net user Administrator "$Password" /active:yes

        # Download cloudflared.exe directly for speed
        Write-Host "📦 Installing Cloudflare Tunnel..."
        Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\Windows\cloudflared.exe"

        $cfJob = Start-Job -ScriptBlock {
            $ErrorActionPreference = "SilentlyContinue"
            cloudflared.exe tunnel --url tcp://localhost:3389
        }

        $cfUrl = ""
        for ($i=1; $i -le 20; $i++) {
            Start-Sleep -Seconds 2
            $output = Receive-Job -Job $cfJob -ErrorAction SilentlyContinue | Out-String
            if ($output -match 'tcp://[a-zA-Z0-9\.-]+:([0-9]+)') {
                $cfUrl = $matches[0]
                break
            }
        }

        # Install Tailscale directly via MSI
        Write-Host "📦 Installing Tailscale..."
        try {
            Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "$env:TEMP\tailscale-setup.exe"
            Start-Process "$env:TEMP\tailscale-setup.exe" -ArgumentList "/quiet /norestart" -Wait
            $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
            if (-not (Test-Path $tailscaleExe)) {
                $tailscaleExe = "C:\Program Files (x86)\Tailscale\tailscale.exe"
            }
            & $tailscaleExe up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --accept-routes --hostname="rdp-runner"
            Start-Sleep -Seconds 3
            $TsIp = (& $tailscaleExe ip -4).Trim()
        } catch {
            $TsIp = "Tailscale Offline"
        }

        # Pre-Install Parsec Streamer & Host Service
        Write-Host "⚡ Installing Parsec Streamer..."
        try {
            Invoke-WebRequest -Uri "https://builds.parsec.app/package/parsec-windows.exe" -OutFile "$env:TEMP\parsec-setup.exe"
            Start-Process "$env:TEMP\parsec-setup.exe" -ArgumentList "/S /shared" -Wait
            $parsecDir = "C:\ProgramData\Parsec"
            if (-not (Test-Path $parsecDir)) { New-Item -ItemType Directory -Force -Path $parsecDir }
            
            $configContent = "app_host = 1`nserver_name = EraRDP"
            $parsecSid = "${{ secrets.PARSEC_SESSION_ID }}"
            if ($parsecSid -and $parsecSid -ne "") {
                $configContent += "`nsecret_session_id = $parsecSid"
            }
            Set-Content -Path "$parsecDir\config.txt" -Value $configContent
            Restart-Service -Name "Parsec" -ErrorAction SilentlyContinue
        } catch {
            Write-Host "Parsec setup notice."
        }

        $InfoBlock = "RDP_INFO_START`nCF_TUNNEL: $cfUrl`nTAILSCALE_IP: $TsIp`nUSERNAME: $Username`nPASSWORD: $Password`nPORT: 3389`nPARSEC: Configured`nRDP_INFO_END"

        Write-Host "========================================"
        Write-Host $InfoBlock
        Write-Host "========================================"

        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### High-Speed RDP Details`n- **Cloudflare Tunnel**: $cfUrl`n- **Tailscale IP**: $TsIp`n- **Username**: $Username`n- **Password**: $Password`n- **Port**: 3389`n- **Parsec**: Configured"

        try {
            gh api "/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/comments" -f body="$InfoBlock"
        } catch {}

    - name: Keep Alive Loop
      shell: powershell
      run: |
        Write-Host "RDP session active. Keeping workflow alive for 6 hours..."
        for ($i=1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "RDP session active ($i / 360 minutes)..."
        }

    - name: Logout & Remove from Tailscale
      if: always()
      shell: powershell
      run: |
        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
        if (Test-Path $tailscaleExe) {
            & $tailscaleExe logout
        }

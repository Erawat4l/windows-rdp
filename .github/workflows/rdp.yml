name: Windows RDP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rdp:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install & Connect Tailscale
      shell: powershell
      run: |
        choco install tailscale -y
        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
        if (-not (Test-Path $tailscaleExe)) {
            $tailscaleExe = "C:\Program Files (x86)\Tailscale\tailscale.exe"
        }
        & $tailscaleExe up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --accept-routes

    - name: Enable Remote Desktop & Set Password
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: powershell
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

        $PasswordChars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*"
        $Password = -join ((1..16) | ForEach-Object { $PasswordChars[(Get-Random -Maximum $PasswordChars.Length)] })

        $Username = "runneradmin"
        $SecPassword = ConvertTo-SecureString $Password -AsPlainText -Force
        
        try {
            Set-LocalUser -Name $Username -Password $SecPassword
        } catch {
            net user $Username $Password /add
            net localgroup Administrators $Username /add
        }

        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
        if (-not (Test-Path $tailscaleExe)) {
            $tailscaleExe = "C:\Program Files (x86)\Tailscale\tailscale.exe"
        }
        $TsIp = (& $tailscaleExe ip -4).Trim()

        $InfoBlock = "RDP_INFO_START`nTAILSCALE_IP: $TsIp`nUSERNAME: $Username`nPASSWORD: $Password`nPORT: 3389`nRDP_INFO_END"

        Write-Host "========================================"
        Write-Host $InfoBlock
        Write-Host "========================================"

        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### RDP Connection Details`n- **Tailscale IP**: $TsIp`n- **Username**: $Username`n- **Password**: $Password`n- **Port**: 3389"

        try {
            gh api "/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/comments" -f body="$InfoBlock"
        } catch {
            Write-Host "Failed to post commit comment."
        }

    - name: Keep Alive Loop
      shell: powershell
      run: |
        Write-Host "RDP session active. Keeping workflow alive for 6 hours..."
        for ($i=1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "RDP session active ($i / 360 minutes)..."
        }

    - name: Logout & Remove from Tailscale
      if: always()
      shell: powershell
      run: |
        Write-Host "Cleaning up Tailscale device node..."
        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
        if (-not (Test-Path $tailscaleExe)) {
            $tailscaleExe = "C:\Program Files (x86)\Tailscale\tailscale.exe"
        }
        & $tailscaleExe logout

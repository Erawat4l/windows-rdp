import sys

yaml_content = '''name: Personal Windows PC RDP & Terminal

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: write-all

jobs:
  rdp:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fast Boot Personal PC (Erawat), High-Speed RDP, SSH & Tailscale
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SECRET_USER: ${{ secrets.RDP_USERNAME }}
        SECRET_PASS: ${{ secrets.RDP_PASSWORD }}
        SECRET_PUBKEY: ${{ secrets.SSH_PUBKEY }}
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      shell: powershell
      run: |
        $ErrorActionPreference = 'Continue'

        Write-Host "Creating Primary User Account: Erawat..."
        $Username = "Erawat"
        if ($env:SECRET_USER -and $env:SECRET_USER -ne "") { $Username = $env:SECRET_USER }

        $Password = '@EraRDP0811#'
        if ($env:SECRET_PASS -and $env:SECRET_PASS -ne "") { $Password = $env:SECRET_PASS }

        $SecPassword = ConvertTo-SecureString $Password -AsPlainText -Force

        # 1. Create Primary User: Erawat
        New-LocalUser -Name "Erawat" -Password $SecPassword -FullName "Erawat" -Description "Personal PC Owner" -ErrorAction SilentlyContinue
        Set-LocalUser -Name "Erawat" -Password $SecPassword -ErrorAction SilentlyContinue
        Enable-LocalUser -Name "Erawat" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Administrators" -Member "Erawat" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Erawat" -ErrorAction SilentlyContinue

        # Initialize User Directory Structure
        $userDir = "C:\Users\Erawat"
        if (-not (Test-Path $userDir)) { New-Item -ItemType Directory -Force -Path $userDir -ErrorAction SilentlyContinue }
        icacls.exe "$userDir" /grant "Erawat:(OI)(CI)F" /grant "*S-1-5-32-544:(OI)(CI)F" /grant "*S-1-5-18:(OI)(CI)F" /T 2>$null

        $subDirs = @("Desktop", "Documents", "Downloads", "Pictures", "Videos", "Music")
        foreach ($sub in $subDirs) {
            $p = Join-Path $userDir $sub
            if (-not (Test-Path $p)) { New-Item -ItemType Directory -Force -Path $p -ErrorAction SilentlyContinue }
        }

        # Force ProfileImagePath for Erawat SID in Registry
        try {
            $userSid = (Get-LocalUser -Name "Erawat").SID.Value
            if ($userSid) {
                $pKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$userSid"
                if (-not (Test-Path $pKey)) { New-Item -Path $pKey -Force -ErrorAction SilentlyContinue }
                Set-ItemProperty -Path $pKey -Name "ProfileImagePath" -Value "C:\Users\Erawat" -Force -ErrorAction SilentlyContinue
            }
        } catch {}

        # Hide extra runner accounts from Windows Login screen
        $userListPath = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList'
        if (-not (Test-Path $userListPath)) { New-Item -Path $userListPath -Force -ErrorAction SilentlyContinue }
        Set-ItemProperty -Path $userListPath -Name "runneradmin" -Value 0 -Type DWord -ErrorAction SilentlyContinue
        Set-ItemProperty -Path $userListPath -Name "Administrator" -Value 0 -Type DWord -ErrorAction SilentlyContinue
        Set-ItemProperty -Path $userListPath -Name "Guest" -Value 0 -Type DWord -ErrorAction SilentlyContinue
        Set-ItemProperty -Path $userListPath -Name "DefaultAccount" -Value 0 -Type DWord -ErrorAction SilentlyContinue

        # Configure AutoLogon directly into Erawat
        $winlogonPath = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
        Set-ItemProperty -Path $winlogonPath -Name "AutoAdminLogon" -Value "1" -ErrorAction SilentlyContinue
        Set-ItemProperty -Path $winlogonPath -Name "DefaultUserName" -Value "Erawat" -ErrorAction SilentlyContinue
        Set-ItemProperty -Path $winlogonPath -Name "DefaultPassword" -Value "$Password" -ErrorAction SilentlyContinue
        Set-ItemProperty -Path $winlogonPath -Name "DefaultDomainName" -Value "EraRDP" -ErrorAction SilentlyContinue

        # Fast Purge Preinstalled Runner Tool Clutter from C:\
        $cleanItems = @(
            'C:\actionarchivecache', 'C:\Android', 'C:\azureCli', 'C:\azureDevOpsCli', 'C:\cobertura-2.1.1',
            'C:\ghcup', 'C:\hostedtoolcache', 'C:\image', 'C:\Julia', 'C:\mingw32', 'C:\mingw64',
            'C:\Miniconda', 'C:\Modules', 'C:\msys64', 'C:\npm', 'C:\Packages', 'C:\post-generation',
            'C:\PostgreSQL', 'C:\PSModuleAnalysisCachePath', 'C:\rtools45', 'C:\selenium', 'C:\SeleniumWebDrivers',
            'C:\shells', 'C:\Strawberry', 'C:\tools', 'C:\vcpkg', 'C:\appverifUI.dll', 'C:\imagedata.json',
            'C:\software-report.json', 'C:\software-report.md', 'C:\vfcompat.dll'
        )
        foreach ($ci in $cleanItems) {
            if (Test-Path $ci) {
                cmd.exe /c "rmdir /s /q `"$ci`"" 2>$null
                Remove-Item -Path $ci -Recurse -Force -ErrorAction SilentlyContinue
            }
        }

        # Unify and Junction-Link any dynamic user profile folders directly into C:\Users\Erawat
        Get-ChildItem -Path "C:\Users" -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne "Erawat" -and $_.Name -ne "Public" -and $_.Name -ne "Default" } | ForEach-Object {
            $pPath = $_.FullName
            try {
                if (-not (Get-Item $pPath).Attributes.HasFlag([System.IO.FileAttributes]::ReparsePoint)) {
                    Copy-Item -Path "$pPath\*" -Destination "C:\Users\Erawat" -Recurse -Force -ErrorAction SilentlyContinue
                    Remove-Item -Path $pPath -Recurse -Force -ErrorAction SilentlyContinue
                    New-Item -ItemType Junction -Path $pPath -Value "C:\Users\Erawat" -Force -ErrorAction SilentlyContinue
                }
            } catch {}
        }

        # Restore Saved Personal PC Storage State asynchronously/fast if available
        $stateZip = "$env:TEMP/erawat_pc_state.zip"
        try {
            & gh release download pc-state --pattern "erawat_pc_state.zip" --dir "$env:TEMP" --clobber 2>$null
            if (Test-Path $stateZip) {
                Write-Host "Restoring your Desktop, Documents, and Downloads..."
                Expand-Archive -Path $stateZip -DestinationPath $userDir -Force -ErrorAction SilentlyContinue
            }
        } catch {}

        # Hide System & Runner Directories
        cmd.exe /c "attrib +h +s C:\actions-runner" 2>$null
        cmd.exe /c "attrib +h +s C:\WindowsAzure" 2>$null
        cmd.exe /c "attrib +h +s C:\inetpub" 2>$null
        cmd.exe /c "attrib +h +s C:\PSModuleAnalysisCachePath" 2>$null
        cmd.exe /c "attrib +h +s C:\Temp" 2>$null
        cmd.exe /c "attrib +h +s C:\Users\runneradmin" 2>$null
        cmd.exe /c "attrib +h +s C:\Users\Public" 2>$null

        # Clean Desktop Clutter
        Remove-Item -Path "C:\Users\Public\Desktop\*" -Recurse -Force -ErrorAction SilentlyContinue

        # Rename Computer Hostname to EraRDP
        Rename-Computer -NewName "EraRDP" -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName' -Name "ComputerName" -Value "EraRDP" -ErrorAction SilentlyContinue
        Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ActiveComputerName' -Name "ComputerName" -Value "EraRDP" -ErrorAction SilentlyContinue

        # Enable RDP & Remove Desktop Watermark
        Write-Host "Enabling Remote Desktop..."
        bcdedit /set testsigning off -ErrorAction SilentlyContinue
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows' -Name 'DisplayNotSupported' -Value 0 -ErrorAction SilentlyContinue
        Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'PaintDesktopVersion' -Value 0 -ErrorAction SilentlyContinue
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force -ErrorAction SilentlyContinue

        # Fast Network Latency Tweaks
        $sysProfile = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile'
        if (-not (Test-Path $sysProfile)) { New-Item -Path $sysProfile -Force -ErrorAction SilentlyContinue }
        Set-ItemProperty -Path $sysProfile -Name "NetworkThrottlingIndex" -Value 4294967295 -Type DWord -ErrorAction SilentlyContinue
        Set-ItemProperty -Path $sysProfile -Name "SystemResponsiveness" -Value 0 -Type DWord -ErrorAction SilentlyContinue

        # Custom PowerShell Prompt & Auto-Formatting LS Table
        $promptLines = @(
            'try { [Console]::Clear() } catch {}',
            '$erawatMain = "C:\Users\Erawat"',
            'if ((Get-Location).Path -like "*erawat.*" -or (Get-Location).Path -eq "C:\Users\runneradmin") { Set-Location $erawatMain -ErrorAction SilentlyContinue }',
            'function prompt { $p = (Get-Location).Path -replace "(?i)erawat\.[a-z0-9_-]+","Erawat" -replace "(?i)runneradmin","Erawat" -replace "(?i)Administrator","Erawat"; return "Erawat@RDP $p> " }',
            'function ls { param([string]$Path = ".", [switch]$a, [switch]$la, [switch]$l, [switch]$Force); $items = Get-ChildItem -Path $Path -ErrorAction SilentlyContinue; if (-not $Force -and -not $a -and -not $la) { $exclude = @("actions-runner", "WindowsAzure", "inetpub", "PSModuleAnalysisCachePath", "runneradmin", "Public", "Temp", "actionarchivecache", "Android", "azureCli", "azureDevOpsCli", "cobertura-2.1.1", "ghcup", "hostedtoolcache", "image", "Julia", "mingw32", "mingw64", "Miniconda", "Modules", "msys64", "npm", "Packages", "post-generation", "PostgreSQL", "rtools45", "selenium", "SeleniumWebDrivers", "shells", "Strawberry", "tools", "vcpkg", "appverifUI.dll", "imagedata.json", "software-report.json", "software-report.md", "vfcompat.dll"); $items = $items | Where-Object { $n = $_.Name; if ($exclude -contains $n -or $n -like "erawat.*") { return $false }; return $true } }; if ($items) { $items | Select-Object Mode, @{N="LastWriteTime";E={$_.LastWriteTime.ToString("M/d/yyyy  h:mm tt")}}, @{N="Length";E={if($_.Length){$_.Length}else{""}}}, Name | Format-Table -AutoSize } }',
            'function ll { ls -a }'
        )
        $promptCode = $promptLines -join "`r`n"

        $profilePaths = @(
            "C:\Windows\System32\WindowsPowerShell\v1.0\profile.ps1",
            "C:\Windows\System32\WindowsPowerShell\v1.0\Microsoft.PowerShell_profile.ps1",
            "C:\Users\Erawat\Documents\WindowsPowerShell\profile.ps1",
            "C:\Users\Erawat\Documents\WindowsPowerShell\Microsoft.PowerShell_profile.ps1"
        )
        foreach ($pp in $profilePaths) {
            $parent = Split-Path -Parent $pp
            if (-not (Test-Path $parent)) { New-Item -ItemType Directory -Force -Path $parent -ErrorAction SilentlyContinue }
            Set-Content -Path $pp -Value $promptCode -ErrorAction SilentlyContinue
        }

        # Fast OpenSSH Configuration
        Write-Host "Configuring OpenSSH Server..."
        Set-Service -Name sshd -StartupType Automatic -ErrorAction SilentlyContinue
        Start-Service sshd -ErrorAction SilentlyContinue
        Get-Process -Name sshd -ErrorAction SilentlyContinue | ForEach-Object { $_.PriorityClass = 'High' }
        
        $sshdDir = "C:\ProgramData\ssh"
        if (-not (Test-Path $sshdDir)) { New-Item -ItemType Directory -Force -Path $sshdDir -ErrorAction SilentlyContinue }
        & "C:\Windows\System32\OpenSSH\ssh-keygen.exe" -A 2>$null

        @("Port 22", "ListenAddress 0.0.0.0", "ListenAddress ::", "StrictModes no", "PermitRootLogin yes", "PasswordAuthentication yes", "PubkeyAuthentication yes", "UseDNS no", "GSSAPIAuthentication no", "AuthorizedKeysFile .ssh/authorized_keys", "Subsystem sftp sftp-server.exe") | Set-Content "$sshdDir\sshd_config"

        $pubKey = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICVUU2tFpkFT0hrHQYtMnPKZ+ElJf1yZ2lKQ5WXjQmc2 u0_a357@localhost"
        if ($env:SECRET_PUBKEY -and $env:SECRET_PUBKEY -ne "") { $pubKey = $env:SECRET_PUBKEY }
        if ($pubKey -and $pubKey -ne "") {
            $adminKeys = "$sshdDir\administrators_authorized_keys"
            [System.IO.File]::WriteAllText($adminKeys, $pubKey + "`r`n", [System.Text.Encoding]::ASCII)
            takeown.exe /F "$adminKeys" /A 2>$null
            icacls.exe "$adminKeys" /inheritance:r /grant "*S-1-5-32-544:F" /grant "*S-1-5-18:F" 2>$null

            $userKeysDir = "C:\Users\Erawat\.ssh"
            if (-not (Test-Path $userKeysDir)) { New-Item -ItemType Directory -Force -Path $userKeysDir -ErrorAction SilentlyContinue }
            $userKeys = "$userKeysDir\authorized_keys"
            [System.IO.File]::WriteAllText($userKeys, $pubKey + "`r`n", [System.Text.Encoding]::ASCII)
            icacls.exe "$userKeysDir" /grant "Erawat:F" /grant "*S-1-5-32-544:F" /grant "*S-1-5-18:F" 2>$null
            icacls.exe "$userKeys" /inheritance:r /grant "Erawat:F" /grant "*S-1-5-32-544:F" /grant "*S-1-5-18:F" 2>$null
        }

        if (-not (Test-Path "HKLM:\SOFTWARE\OpenSSH")) { New-Item -Path "HKLM:\SOFTWARE\OpenSSH" -Force -ErrorAction SilentlyContinue }
        New-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name "DefaultShell" -Value "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -PropertyType String -Force -ErrorAction SilentlyContinue
        New-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name "DefaultShellCommandOption" -Value "-NoLogo" -PropertyType String -Force -ErrorAction SilentlyContinue

        Restart-Service sshd -Force -ErrorAction SilentlyContinue

        # Install Tailscale via Chocolatey
        Write-Host "Installing Tailscale via Chocolatey..."
        choco install tailscale --no-progress -y

        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

        # Pure PowerShell Native Tailscale Auth Key Generation
        $tsKey = $env:TAILSCALE_AUTHKEY
        if (-not $tsKey -or $tsKey -eq "") {
            try {
                Write-Host "Generating fresh Tailscale OAuth Access Token..."
                $body = @{
                    grant_type = "client_credentials"
                    client_id = "kPnFqAw4u711CNTRL"
                    client_secret = "tskey-client-kPnFqAw4u711CNTRL-Nch1U6AHqRfY94cPB34oQfWyDwRGwhzad"
                }
                $tokRes = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/oauth/token" -Method Post -Body $body
                $accToken = $tokRes.access_token

                if ($accToken) {
                    Write-Host "Requesting Tailscale Ephemeral Auth Key..."
                    $keyBody = @{
                        capabilities = @{
                            devices = @{
                                create = @{
                                    reusable = $true
                                    ephemeral = $true
                                    preauthorized = $true
                                    tags = @("tag:rdp")
                                }
                            }
                        }
                        expirySeconds = 7776000
                    } | ConvertTo-Json -Depth 5

                    $headers = @{
                        Authorization = "Bearer $accToken"
                        "Content-Type" = "application/json"
                    }
                    $keyRes = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/tailnet/-/keys" -Method Post -Headers $headers -Body $keyBody
                    if ($keyRes.key) {
                        $tsKey = $keyRes.key
                        Write-Host "Successfully generated Tailscale Key: $($tsKey.Substring(0, 15))..."
                    }
                }
            } catch {
                Write-Host "Tailscale Auth Key Generation Warning: $_"
            }
        }

        Set-Service -Name Tailscale -StartupType Automatic -ErrorAction SilentlyContinue
        Start-Service -Name Tailscale -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 3

        $tsBinary = "C:\Program Files\Tailscale\tailscale.exe"
        if (-not (Test-Path $tsBinary)) {
            $tsBinary = "C:\Program Files (x86)\Tailscale\tailscale.exe"
        }

        $TsIp = ""
        for ($i=1; $i -le 20; $i++) {
            Write-Host "Connecting Tailscale (Attempt $i/20)..."
            $upOut = & "$tsBinary" up --authkey="$tsKey" --accept-routes --hostname="erardp" 2>&1 | Out-String
            Write-Host "Tailscale Log: $upOut"
            Start-Sleep -Seconds 2
            $rawIp = (& "$tsBinary" ip -4 2>$null)
            if ($rawIp) {
                $TsIp = $rawIp.Trim()
                if ($TsIp -match '^100\.') {
                    Write-Host "Tailscale IP Acquired: $TsIp"
                    break
                }
            }
        }

        # Disable Windows Firewall AFTER Tailscale Adapter is active to allow Port 22 and Port 3389
        Write-Host "Disabling Windows Firewall & Opening Ports 22 & 3389 on Tailscale..."
        Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False -ErrorAction SilentlyContinue
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
        Enable-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -ErrorAction SilentlyContinue
        New-NetFirewallRule -DisplayName "OpenSSH-22-Allow" -Direction Inbound -Protocol TCP -LocalPort 22 -Action Allow -ErrorAction SilentlyContinue
        New-NetFirewallRule -DisplayName "RDP-3389-Allow" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -ErrorAction SilentlyContinue

        # Background Cloudflare Tunnel start
        Start-Job -ScriptBlock {
            try {
                curl.exe -sL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -o "C:\Windows\cloudflared.exe"
                & "C:\Windows\cloudflared.exe" tunnel --url tcp://localhost:3389
            } catch {}
        } | Out-Null

        $InfoBlock = "RDP_INFO_START`nTAILSCALE_IP: $TsIp`nUSERNAME: Erawat`nPASSWORD: $Password`nPORT: 3389`nRDP_INFO_END"
        Write-Host $InfoBlock
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Personal Windows PC RDP Details`n- **Tailscale IP**: $TsIp`n- **Username**: Erawat`n- **Password**: $Password`n- **Port**: 3389"

        try {
            gh api "/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/comments" -f body="$InfoBlock"
        } catch {}
        exit 0

    - name: Keep Alive & Auto-Save Personal PC Storage Loop
      shell: powershell
      run: |
        Write-Host "Personal Windows PC Active (6 Hour Max Duration). Periodically backing up Desktop, Documents, and Downloads..."
        $stateZip = "$env:TEMP/erawat_pc_state.zip"
        for ($i=1; $i -le 720; $i++) {
            Start-Sleep -Seconds 30
            try {
                $sourceDirs = @()
                $dt = "C:\Users\Erawat\Desktop"
                $dc = "C:\Users\Erawat\Documents"
                $dw = "C:\Users\Erawat\Downloads"
                if (Test-Path $dt) { $sourceDirs += $dt }
                if (Test-Path $dc) { $sourceDirs += $dc }
                if (Test-Path $dw) { $sourceDirs += $dw }
                if ($sourceDirs.Count -gt 0) {
                    Compress-Archive -Path $sourceDirs -DestinationPath $stateZip -Force -ErrorAction SilentlyContinue
                    gh release upload pc-state $stateZip --clobber 2>$null
                }
            } catch {}
        }

    - name: Final Save & Remove from Tailscale
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: powershell
      run: |
        Write-Host "Saving final Personal PC storage state before VM shutdown..."
        $stateZip = "$env:TEMP/erawat_pc_state.zip"
        try {
            $sourceDirs = @()
            $dt = "C:\Users\Erawat\Desktop"
            $dc = "C:\Users\Erawat\Documents"
            $dw = "C:\Users\Erawat\Downloads"
            if (Test-Path $dt) { $sourceDirs += $dt }
            if (Test-Path $dc) { $sourceDirs += $dc }
            if (Test-Path $dw) { $sourceDirs += $dw }
            if ($sourceDirs.Count -gt 0) {
                Compress-Archive -Path $sourceDirs -DestinationPath $stateZip -Force -ErrorAction SilentlyContinue
                gh release upload pc-state $stateZip --clobber 2>$null
                Write-Host "Personal PC state successfully saved to cloud persistent storage!"
            }
        } catch {}

        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
        if (Test-Path $tailscaleExe) {
            & $tailscaleExe logout
        }
'''

with open('/data/data/com.termux/files/home/Projects/windows-rdp/.github/workflows/run.yml', 'w') as f:
    f.write(yaml_content)

print("Updated run.yml successfully")

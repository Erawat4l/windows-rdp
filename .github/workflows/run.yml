name: High-Speed Windows RDP & Terminal

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: write-all

jobs:
  rdp:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Enable High-Speed Remote Desktop & SSH Terminal
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SECRET_USER: ${{ secrets.RDP_USERNAME }}
        SECRET_PASS: ${{ secrets.RDP_PASSWORD }}
      shell: powershell
      run: |
        Write-Host "⚙️ Enabling Remote Desktop & OpenSSH..."
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -ErrorAction SilentlyContinue
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -ErrorAction SilentlyContinue

        $Username = if ($env:SECRET_USER -and $env:SECRET_USER -ne "") { $env:SECRET_USER } else { "Erawat" }
        $Password = if ($env:SECRET_PASS -and $env:SECRET_PASS -ne "") { $env:SECRET_PASS } else { "@EraRDP0811#" }
        $SecPassword = ConvertTo-SecureString $Password -AsPlainText -Force

        try { Set-LocalUser -Name $Username -Password $SecPassword } catch {}
        net user $Username "$Password" /add
        net user $Username "$Password"
        net localgroup Administrators $Username /add

        try { Set-LocalUser -Name "Administrator" -Password $SecPassword; Enable-LocalUser -Name "Administrator" } catch {}
        net user Administrator "$Password" /active:yes

        # Rename Computer Hostname to EraRDP
        try {
            Rename-Computer -NewName "EraRDP" -Force -ErrorAction SilentlyContinue
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName' -Name "ComputerName" -Value "EraRDP" -ErrorAction SilentlyContinue
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ActiveComputerName' -Name "ComputerName" -Value "EraRDP" -ErrorAction SilentlyContinue
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name "NV Hostname" -Value "EraRDP" -ErrorAction SilentlyContinue
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name "Hostname" -Value "EraRDP" -ErrorAction SilentlyContinue
        } catch {}

        # Set custom PowerShell prompt to display Erawat@RDP C:\Users\erawat>
        $promptCode = "Clear-Host`nfunction prompt { `"$Username@RDP `" + (Get-Location).Path + `"> `" }"
        $profileDir = "C:\Windows\System32\WindowsPowerShell\v1.0"
        Set-Content -Path "$profileDir\profile.ps1" -Value $promptCode -ErrorAction SilentlyContinue

        $userProfileDir = "C:\Users\$Username\Documents\WindowsPowerShell"
        if (-not (Test-Path $userProfileDir)) { New-Item -ItemType Directory -Force -Path $userProfileDir }
        Set-Content -Path "$userProfileDir\Microsoft.PowerShell_profile.ps1" -Value $promptCode -ErrorAction SilentlyContinue

        # Disable Windows Firewall inside VM & Configure OpenSSH Server
        Write-Host "⚙️ Disabling Windows Firewall & Configuring OpenSSH Server..."
        Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False -ErrorAction SilentlyContinue

        try {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 -ErrorAction SilentlyContinue
            Start-Service sshd -ErrorAction SilentlyContinue
            Set-Service -Name sshd -StartupType Automatic -ErrorAction SilentlyContinue
            
            $pubKey = if ("${{ secrets.SSH_PUBKEY }}" -and "${{ secrets.SSH_PUBKEY }}" -ne "") { "${{ secrets.SSH_PUBKEY }}" } else { "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICVUU2tFpkFT0hrHQYtMnPKZ+ElJf1yZ2lKQ5WXjQmc2 u0_a357@localhost" }
            if ($pubKey -and $pubKey -ne "") {
                $adminKeys = "C:\ProgramData\ssh\administrators_authorized_keys"
                [System.IO.File]::WriteAllText($adminKeys, $pubKey + "`r`n", [System.Text.Encoding]::ASCII)
                & icacls.exe $adminKeys /inheritance:r /grant "Administrators:F" /grant "SYSTEM:F" 2>$null

                $userKeysDir = "C:\Users\$Username\.ssh"
                if (-not (Test-Path $userKeysDir)) { New-Item -ItemType Directory -Force -Path $userKeysDir }
                $userKeys = "$userKeysDir\authorized_keys"
                [System.IO.File]::WriteAllText($userKeys, $pubKey + "`r`n", [System.Text.Encoding]::ASCII)
            }

            if (-not (Test-Path "HKLM:\SOFTWARE\OpenSSH")) { New-Item -Path "HKLM:\SOFTWARE\OpenSSH" -Force }
            Set-ItemProperty -Path 'HKLM:\SOFTWARE\OpenSSH' -Name DefaultShell -Value "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -PropertyType String -Force
            Remove-ItemProperty -Path 'HKLM:\SOFTWARE\OpenSSH' -Name DefaultShellCommandOption -ErrorAction SilentlyContinue

            Restart-Service sshd -Force -ErrorAction SilentlyContinue
        } catch {}

        Write-Host "📦 Installing Cloudflare Tunnel..."
        curl.exe -sL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -o "C:\Windows\cloudflared.exe"

        $cfJob = Start-Job -ScriptBlock {
            & "C:\Windows\cloudflared.exe" tunnel --url tcp://localhost:3389
        }

        $cfUrl = ""
        for ($i=1; $i -le 15; $i++) {
            Start-Sleep -Seconds 2
            $output = Receive-Job -Job $cfJob -ErrorAction SilentlyContinue | Out-String
            if ($output -match 'tcp://[a-zA-Z0-9\.-]+:([0-9]+)') {
                $cfUrl = $matches[0]
                break
            }
        }

        Write-Host "📦 Installing Tailscale..."
        try {
            curl.exe -sL "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -o "$env:TEMP\ts-setup.exe"
            Start-Process "$env:TEMP\ts-setup.exe" -ArgumentList "/quiet" -Wait
            $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
            if (-not (Test-Path $tailscaleExe)) {
                $tailscaleExe = "C:\Program Files (x86)\Tailscale\tailscale.exe"
            }
            & $tailscaleExe up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --accept-routes --hostname="erardp"
            Start-Sleep -Seconds 3
            $TsIp = (& $tailscaleExe ip -4).Trim()
        } catch {
            $TsIp = "Tailscale Offline"
        }

        $InfoBlock = "RDP_INFO_START`nCF_TUNNEL: $cfUrl`nTAILSCALE_IP: $TsIp`nUSERNAME: $Username`nPASSWORD: $Password`nPORT: 3389`nRDP_INFO_END"
        Write-Host $InfoBlock
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### High-Speed RDP Details`n- **Cloudflare Tunnel**: $cfUrl`n- **Tailscale IP**: $TsIp`n- **Username**: $Username`n- **Password**: $Password`n- **Port**: 3389"

        try {
            gh api "/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/comments" -f body="$InfoBlock" 2>$null
        } catch {}
        $global:LASTEXITCODE = 0

    - name: Keep Alive Loop
      shell: powershell
      run: |
        Write-Host "RDP session active. Keeping workflow alive for 6 hours..."
        for ($i=1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "RDP session active ($i / 360 minutes)..."
        }

    - name: Logout & Remove from Tailscale
      if: always()
      shell: powershell
      run: |
        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
        if (Test-Path $tailscaleExe) {
            & $tailscaleExe logout
        }
